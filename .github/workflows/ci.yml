name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Non-negotiable #8: no secrets in git, ever.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # version comes from package.json "packageManager"; setting it here too is an error
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # brand tokens.css must be in sync (drift guard), then the rest of the gates.
      - run: pnpm --filter @agentic-bitcoin/brand build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  evals:
    # Intent/adversarial evals need a Claude API key; the job is a no-op (exit 0, "skipped") without one.
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push'
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agentic-bitcoin/agent test:evals
